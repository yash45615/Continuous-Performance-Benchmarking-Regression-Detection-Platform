name: Continuous Performance Benchmark

on:

  push:

  pull_request:

jobs:

  tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest backend/tests -v


  benchmark:

    runs-on: ubuntu-latest

    needs: tests

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run benchmark framework tests
        run: |
          pytest benchmarks -v --benchmark-only

      - name: Run regression logic
        run: |
          pytest backend/tests/test_performance_logic.py -v